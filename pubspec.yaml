name: noor
description: "NOOR | Ã™â€ Ã™Ë†Ã˜Â± Ã¢â‚¬â€ Premium Islamic super app (Quran, prayer times, adhkar)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  adhan: ^2.0.0+1
  audio_service: ^0.18.19
  audio_session: ^0.2.2
  crypto: ^3.0.7
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.2
  go_router: ^18.1.1
  google_sign_in: ^7.2.0
  hijri: ^3.0.1
  http: ^1.6.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sign_in_with_apple: ^8.2.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # Firebase 13 and GoogleSignIn 9 conflict on gtm-session-fetcher under
  # SwiftPM; CocoaPods only resolves the pods actually used.
  config:
    enable-swift-package-manager: false
  assets:
    - assets/icon/artwork.jpg
    - assets/data/
    - assets/data/quran/
    - assets/data/books/
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

